name: Profile Widgets

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: '3.12'
      - uses: extractions/setup-just@v4
      - uses: actions/cache@v6.1.0
        id: mirage
        with:
          path: ~/.cargo/bin/mirage
          key: ${{ runner.os }}-ubuntu-26.04-mirage-${{ hashFiles('.mirage.tag') }}
      - name: Install Mirage release
        if: steps.mirage.outputs.cache-hit != 'true'
        run: just install-mirage
      - name: Test and update widgets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: just refresh
      - name: Validate generated output
        run: git diff --check
      - name: Publish changed output
        env:
          GIT_USER_NAME: github-actions[bot]
          GIT_USER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMIT_MESSAGE: 'chore(profile): update public-data widgets'
        run: |
          git add config/metric.toml uv.lock README.md assets/
          if ! git diff --cached --quiet; then
            git config user.name "$GIT_USER_NAME"
            git config user.email "$GIT_USER_EMAIL"
            git commit -m "$GIT_COMMIT_MESSAGE"
            git push
          fi
