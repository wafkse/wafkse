name: Profile widgets

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: extractions/setup-just@v3
      - uses: actions/cache@v4
        id: mirage
        with:
          path: ~/.cargo/bin/mirage
          key: ${{ runner.os }}-mirage-a6b7d7cecbebe229803fd181ea612f7f8e19968b
      - name: Install pinned Mirage
        if: steps.mirage.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/wafkse/mirage --rev a6b7d7cecbebe229803fd181ea612f7f8e19968b --package mirage
      - name: Test and update widgets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: just refresh
      - name: Validate generated output
        run: git diff --check
      - name: Publish changed output
        run: |
          git add config/metrics.toml README.md assets/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(profile): update public-data widgets'
            git push
          fi
