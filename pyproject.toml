[project]
name = "wafkse-profile"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "fonttools>=4.60,<5",
    "pydantic>=2.12,<3",
    "tomlkit>=0.13,<1",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
python_files = [
    "test_*.py",
    "test-*.py",
    "*_test.py",
    "*-test.py",
]
addopts = ["--import-mode=importlib"]
